name: Deploy CareerPulse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build (compile check)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://example.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          AUTH_SECRET: ci-build-placeholder-not-for-production
        run: npm run build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require public app URL
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          set -eu
          case "$NEXT_PUBLIC_APP_URL" in
            https://*) ;;
            *)
              echo "Set GitHub Actions variable NEXT_PUBLIC_APP_URL to the public HTTPS origin (https://your-domain)."
              exit 1
              ;;
          esac
          case "$NEXT_PUBLIC_APP_URL" in
            *localhost*|http://backend*|http://app*|http://api*)
              echo "NEXT_PUBLIC_APP_URL must not be localhost or an internal Docker hostname."
              exit 1
              ;;
          esac

      - name: Image name
        id: meta
        run: |
          set -eu
          IMAGE_REPO="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA}"
          echo "image=${IMAGE_REPO}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test VPS TCP connectivity
        run: |
          set -eux
          timeout 10 bash -c '</dev/tcp/${{ secrets.VPS_HOST }}/${{ secrets.VPS_PORT }}'
          echo "TCP connection to VPS succeeded"

      - name: Copy runtime files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml,db/schema.sql,db/seed.sql,db/backup.sh,infra/nginx-careerpulse.conf.example,scripts/vps-pull-up.sh
          target: /opt/careerpulse
          overwrite: true
          timeout: 60s

      - name: Pull image and start
        uses: appleboy/ssh-action@v1.2.0
        env:
          CAREERPULSE_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          debug: false
          envs: CAREERPULSE_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            chmod +x /opt/careerpulse/scripts/vps-pull-up.sh
            /opt/careerpulse/scripts/vps-pull-up.sh
