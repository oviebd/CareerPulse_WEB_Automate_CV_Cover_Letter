name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build (compile check)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://example.com
          AUTH_SECRET: ci-build-placeholder-not-for-production
        run: npm run build

      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high
