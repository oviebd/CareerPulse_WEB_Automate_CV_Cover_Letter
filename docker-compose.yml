# Production runtime — pull pre-built images. Do not build on the VPS.
# Usage: docker compose --env-file .env.prod up -d
#
# CAREERPULSE_IMAGE is set by CI/CD (immutable sha tag) or in .env.prod.

services:
  db:
    image: postgres:16-alpine
    container_name: careerpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-careerpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-careerpulse} -d ${POSTGRES_DB:-careerpulse}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Database is not published to the host.

  app:
    image: ${CAREERPULSE_IMAGE:?Set CAREERPULSE_IMAGE to the GHCR image (e.g. ghcr.io/org/repo:sha-<commit>)}
    container_name: careerpulse
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bind to loopback so only the host reverse proxy can reach the app.
    # Override APP_BIND_HOST / APP_PORT on a shared VPS if 3000 is taken.
    ports:
      - '${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000'
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerpulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-careerpulse}
      UPLOAD_DIR: /data/uploads
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2g
    networks:
      - internal

volumes:
  pgdata:
  uploads:

networks:
  internal:
    name: careerpulse_internal
